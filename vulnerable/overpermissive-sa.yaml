apiVersion: v1
kind: ServiceAccount
metadata:
  name: overpermissive-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: overpermissive-sa-cluster-admin
subjects:
  - kind: ServiceAccount
    name: overpermissive-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: overpermissive-sa-pod
  namespace: default
  labels:
    app: vulnerable
    vulnerability: cluster-admin
spec:
  serviceAccountName: overpermissive-sa
  containers:
    - name: workload
      image: nginx:latest
