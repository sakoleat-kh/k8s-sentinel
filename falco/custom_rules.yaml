json_output: true
json_include_output_property: true
json_include_output_fields_property: true

customRules:
  custom-rules.yaml: |-
    - rule: K8s Sentinel Container Exec
      desc: Detect command execution inside a running container
      condition: >
        evt.type in (execve, execveat)
        and container.id != host
        and not k8s.ns.name=kube-system
      output: >
        K8s Sentinel detected command execution in a container |
        user=%user.name
        uid=%user.uid
        process=%proc.name
        command=%proc.cmdline
        container=%container.name
        image=%container.image.repository
        k8s_pod=%k8s.pod.name
        k8s_namespace=%k8s.ns.name
        technique_id=T1609
        tactic=Execution
      priority: WARNING
      tags: [k8s-sentinel, container, exec]

    - rule: K8s Sentinel Privileged Container Process
      desc: Detect a process spawned inside the K8s Sentinel privileged test pod
      condition: >
        container.id != host
        and container.privileged=true
        and k8s.pod.name=privileged-pod
      output: >
        K8s Sentinel detected process execution in the privileged test pod |
        user=%user.name
        uid=%user.uid
        process=%proc.name
        command=%proc.cmdline
        container=%container.name
        image=%container.image.repository
        k8s_pod=%k8s.pod.name
        k8s_namespace=%k8s.ns.name
        technique_id=T1611
        tactic=Privilege Escalation
      priority: WARNING
      tags: [k8s-sentinel, container, privileged]

    - rule: K8s Sentinel HostPath Write
      desc: Detect a file write through the K8s Sentinel hostPath mount
      condition: >
        evt.type in (openat, openat2, creat)
        and container.id != host
        and k8s.pod.name=hostpath-pod
        and fd.name startswith /host/
        and evt.arg.flags contains O_WRONLY
      output: >
        K8s Sentinel detected write through hostPath mount |
        user=%user.name
        uid=%user.uid
        process=%proc.name
        command=%proc.cmdline
        file=%fd.name
        container=%container.name
        image=%container.image.repository
        k8s_pod=%k8s.pod.name
        k8s_namespace=%k8s.ns.name
        technique_id=T1611
        tactic=Privilege Escalation
      priority: WARNING
      tags: [k8s-sentinel, container, hostpath]

    # Rule 8 comes BEFORE Rule 4 because Falco uses first-match semantics.
    - rule: K8s Sentinel Reverse Shell Activity
      desc: Detect an interactive shell making an unexpected external network connection
      condition: >
        evt.type=connect
        and container.id != host
        and k8s.pod.name=hostpath-pod
        and proc.name in (sh, bash)
        and not fd.snet in (rfc_1918_addresses)
        and fd.rport != 53
      output: >
        K8s Sentinel detected possible reverse shell activity |
        user=%user.name
        uid=%user.uid
        process=%proc.name
        parent_process=%proc.pname
        command=%proc.cmdline
        connection=%fd.name
        destination_ip=%fd.sip
        destination_port=%fd.rport
        container=%container.name
        image=%container.image.repository
        k8s_pod=%k8s.pod.name
        k8s_namespace=%k8s.ns.name
        technique_id=T1059.004
        tactic=Execution
      priority: WARNING
      tags: [k8s-sentinel, container, shell, reverse-shell, t1059]

    - rule: K8s Sentinel Unexpected Outbound Connection
      desc: Detect an unexpected external network connection from the K8s Sentinel hostPath test pod
      condition: >
        evt.type=connect
        and container
        and k8s.pod.name=hostpath-pod
        and fd.type in (ipv4, ipv6)
        and not fd.snet in (rfc_1918_addresses)
        and fd.rport != 53
      output: >
        K8s Sentinel detected unexpected outbound connection |
        user=%user.name
        uid=%user.uid
        process=%proc.name
        command=%proc.cmdline
        connection=%fd.name
        destination_ip=%fd.sip
        destination_port=%fd.rport
        container=%container.name
        image=%container.image.repository
        k8s_pod=%k8s.pod.name
        k8s_namespace=%k8s.ns.name
        technique_id=T1041
        tactic=Exfiltration
      priority: WARNING
      tags: [k8s-sentinel, container, network, outbound]

    - rule: K8s Sentinel Crypto Mining Heuristic
      desc: Detect a sustained CPU-intensive process pattern in the K8s Sentinel test container
      condition: >
        container
        and k8s.pod.name=hostpath-pod
        and proc.name=yes
        and proc.duration > 5000000000
      output: >
        K8s Sentinel detected suspected crypto-mining activity |
        user=%user.name
        uid=%user.uid
        process=%proc.name
        command=%proc.cmdline
        duration_ns=%proc.duration
        container=%container.name
        image=%container.image.repository
        k8s_pod=%k8s.pod.name
        k8s_namespace=%k8s.ns.name
        technique_id=T1496
        tactic=Impact
      priority: WARNING
      tags: [k8s-sentinel, container, cpu, cryptomining]